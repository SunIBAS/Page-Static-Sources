<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二维码合并工具</title>
    <script src="./vue.global.prod.js"></script>
    <script src="./html5-qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #333; }
        .container { max-width: 800px; margin: 0 auto; padding: 24px; }
        h1 { text-align: center; margin-bottom: 8px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 24px; font-size: 14px; }
        .card { background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .btn { padding: 10px 24px; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; transition: all .2s; }
        .btn-primary { background: #4a90d9; color: #fff; }
        .btn-primary:hover { background: #3a7bc8; }
        .btn-primary:disabled { background: #b0c4de; cursor: not-allowed; }
        .btn-secondary { background: #e8e8e8; color: #333; }
        .btn-secondary:hover { background: #ddd; }
        .btn-success { background: #27ae60; color: #fff; }
        .btn-success:hover { background: #219a52; }
        .btn-danger { background: #e74c3c; color: #fff; }
        .btn-danger:hover { background: #c0392b; }
        .btns { display: flex; gap: 10px; flex-wrap: wrap; }

        #reader { width: 100%; max-width: 400px; margin: 16px auto; border-radius: 8px; overflow: hidden; }
        #reader video { border-radius: 8px; }

        .status { padding: 10px 14px; border-radius: 6px; margin: 12px 0; font-size: 14px; }
        .status.info { background: #eaf2fb; color: #2c5f8a; }
        .status.success { background: #e8f8ef; color: #1a7a3a; }
        .status.error { background: #fdecea; color: #a94442; }
        .status.warning { background: #fef9e7; color: #856404; }

        .progress-bar { width: 100%; height: 8px; background: #eee; border-radius: 4px; overflow: hidden; margin: 12px 0; }
        .progress-bar .fill { height: 100%; border-radius: 4px; transition: width .3s; }
        .fill-green { background: #27ae60; }
        .fill-blue { background: #4a90d9; }

        .chunk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; margin: 16px 0; }
        .chunk-dot { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 13px; font-weight: 600; }
        .chunk-dot.received { background: #d4edda; color: #155724; }
        .chunk-dot.missing { background: #f0f0f0; color: #bbb; border: 1px dashed #ddd; }

        textarea { width: 100%; height: 80px; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-family: monospace; font-size: 13px; resize: vertical; }
        .manual-section { margin-top: 12px; }

        .stats-row { display: flex; gap: 16px; flex-wrap: wrap; margin: 12px 0; font-size: 14px; }
        .stats-row span { padding: 4px 12px; background: #f5f5f5; border-radius: 4px; }

        .tab-bar { display: flex; gap: 0; margin-bottom: 0; }
        .tab-bar button { flex: 1; padding: 10px; border: none; background: #eee; cursor: pointer; font-size: 14px; transition: all .2s; }
        .tab-bar button:first-child { border-radius: 8px 0 0 0; }
        .tab-bar button:last-child { border-radius: 0 8px 0 0; }
        .tab-bar button.active { background: #fff; font-weight: 600; }
    </style>
</head>
<body>
    <div id="app">
        <div class="container">
            <h1>二维码合并工具</h1>
            <p class="subtitle">逐个扫描二维码，收集所有分片后合并还原文件</p>

            <div class="card">
                <div class="tab-bar">
                    <button :class="{ active: tab === 'scan' }" @click="switchTab('scan')">📷 扫码</button>
                    <button :class="{ active: tab === 'manual' }" @click="switchTab('manual')">⌨️ 手动输入</button>
                </div>

                <div v-show="tab === 'scan'" style="padding-top:16px; text-align:center;">
                    <div class="btns" style="justify-content:center; margin-bottom:12px;">
                        <button class="btn btn-primary" @click="startScan" :disabled="scanning">
                            {{ scanning ? '扫描中...' : '启动摄像头' }}
                        </button>
                        <button class="btn btn-secondary" @click="stopScan" :disabled="!scanning">停止</button>
                    </div>
                    <div id="reader"></div>
                </div>

                <div v-show="tab === 'manual'" class="manual-section">
                    <p style="margin-bottom:8px; font-size:14px; color:#666;">
                        粘贴分片数据（格式：<code>序号/总片数:Base64数据</code>）
                    </p>
                    <textarea v-model="manualText" placeholder="1/50:AAAAAA..."></textarea>
                    <div style="margin-top:8px;">
                        <button class="btn btn-primary" @click="addManual" :disabled="!manualText.trim()">添加分片</button>
                    </div>
                </div>

                <div v-if="statusMsg" class="status" :class="statusType">{{ statusMsg }}</div>
            </div>

            <div class="card" v-if="totalChunks > 0">
                <h3 style="margin-bottom:4px;">分片进度</h3>
                <div class="stats-row">
                    <span>已收 {{ receivedCount }} / {{ totalChunks }}</span>
                    <span>缺失 {{ missingCount }}</span>
                    <span v-if="lastChunkTime">最后扫码 {{ lastChunkTime }}</span>
                </div>
                <div class="progress-bar">
                    <div class="fill fill-green" :style="{ width: (receivedCount / totalChunks * 100) + '%' }"></div>
                </div>

                <div class="chunk-grid">
                    <div v-for="i in totalChunks" :key="i"
                         class="chunk-dot"
                         :class="chunks[i] ? 'received' : 'missing'">
                        {{ i }}
                    </div>
                </div>

                <div v-if="missingChunks.length > 0" style="font-size:13px; color:#888;">
                    缺失分片: {{ missingChunks.join(', ') }}
                </div>

                <div class="btns" style="margin-top:16px;">
                    <button class="btn btn-success" @click="merge" :disabled="!isComplete">
                        {{ isComplete ? '合并并下载' : '等待所有分片...' }}
                    </button>
                    <button class="btn btn-danger" @click="clearAll">清空所有</button>
                </div>
            </div>

            <div class="card" v-if="downloadUrl">
                <h3>✅ 合并完成</h3>
                <p style="margin:8px 0; font-size:14px; color:#666;">
                    文件大小: {{ mergedSize }} | 已解压为原始格式
                </p>
                <a :href="downloadUrl" :download="filename" class="btn btn-primary" style="text-decoration:none; display:inline-block;">
                    点击下载 {{ filename }}
                </a>
            </div>
        </div>
    </div>

    <script>
    const { createApp, ref, computed, onUnmounted } = Vue;

    createApp({
        setup() {
            const tab = ref('scan');
            const scanning = ref(false);
            const statusMsg = ref('');
            const statusType = ref('info');
            const manualText = ref('');
            const chunks = ref({});
            const totalChunks = ref(0);
            const downloadUrl = ref('');
            const filename = ref('');
            const mergedSize = ref('');
            const lastChunkTime = ref('');
            let scanner = null;

            const receivedCount = computed(() => Object.keys(chunks.value).length);
            const missingCount = computed(() => totalChunks.value - receivedCount.value);
            const isComplete = computed(() => totalChunks.value > 0 && receivedCount.value === totalChunks.value);
            const missingChunks = computed(() => {
                const result = [];
                for (let i = 1; i <= totalChunks.value; i++) {
                    if (!chunks.value[i]) result.push(i);
                }
                return result;
            });

            const showStatus = (msg, type = 'info', duration = 3000) => {
                statusMsg.value = msg;
                statusType.value = type;
                if (duration > 0) {
                    setTimeout(() => { if (statusMsg.value === msg) statusMsg.value = ''; }, duration);
                }
            };

            const parsePayload = (text) => {
                const match = text.trim().match(/^(\d+)\/(\d+):(.+)$/s);
                if (!match) throw new Error('格式错误，应为：序号/总片数:数据');
                const idx = parseInt(match[1]);
                const total = parseInt(match[2]);
                const data = match[3];
                if (idx < 1 || total < 1 || idx > total) throw new Error('序号或总数无效');
                return { idx, total, data };
            };

            const addChunk = (text) => {
                try {
                    const { idx, total, data } = parsePayload(text);
                    const existed = !!chunks.value[idx];
                    chunks.value[idx] = data;

                    if (totalChunks.value === 0) {
                        totalChunks.value = total;
                    } else if (totalChunks.value !== total) {
                        showStatus(`警告：总数不一致 (${totalChunks.value} vs ${total})`, 'warning', 5000);
                        totalChunks.value = total;
                    }

                    lastChunkTime.value = new Date().toLocaleTimeString();

                    if (existed) {
                        showStatus(`分片 #${idx} 已存在，已覆盖`, 'warning');
                    } else {
                        showStatus(`✓ 收到分片 #${idx}/${total}`, 'success', 1500);
                    }
                } catch (err) {
                    showStatus(err.message, 'error', 5000);
                }
            };

            const addManual = () => {
                if (!manualText.value.trim()) return;
                addChunk(manualText.value.trim());
                manualText.value = '';
            };

            const switchTab = (t) => {
                tab.value = t;
                if (t === 'manual' && scanning.value) stopScan();
            };

            const startScan = async () => {
                if (scanning.value) return;
                try {
                    scanner = new Html5Qrcode('reader');
                    scanning.value = true;
                    showStatus('正在启动摄像头...', 'info', 0);

                    await scanner.start(
                        { facingMode: 'environment' },
                        { fps: 10, qrbox: { width: 250, height: 250 } },
                        (decoded) => addChunk(decoded),
                        () => {}
                    );
                    showStatus('摄像头已就绪，请扫描二维码', 'success');
                } catch (err) {
                    showStatus('摄像头启动失败: ' + err.message, 'error');
                    scanning.value = false;
                }
            };

            const stopScan = async () => {
                if (!scanning.value || !scanner) return;
                try {
                    await scanner.stop();
                } catch {}
                scanning.value = false;
                showStatus('已停止扫描', 'info');
            };

            const merge = () => {
                if (!isComplete.value) return;
                try {
                    let base64 = '';
                    for (let i = 1; i <= totalChunks.value; i++) {
                        base64 += chunks.value[i];
                    }
                    const binary = atob(base64);
                    const bytes = new Uint8Array(binary.length);
                    for (let i = 0; i < binary.length; i++) {
                        bytes[i] = binary.charCodeAt(i);
                    }

                    if (downloadUrl.value) URL.revokeObjectURL(downloadUrl.value);
                    const blob = new Blob([bytes], { type: 'application/octet-stream' });
                    downloadUrl.value = URL.createObjectURL(blob);

                    const sz = bytes.length;
                    mergedSize.value = sz < 1024 ? sz + ' B' : sz < 1048576 ? (sz/1024).toFixed(1) + ' KB' : (sz/1048576).toFixed(2) + ' MB';
                    filename.value = 'file.zip';
                    showStatus('合并完成！', 'success');
                } catch (err) {
                    showStatus('合并失败: ' + err.message, 'error', 5000);
                }
            };

            const clearAll = () => {
                chunks.value = {};
                totalChunks.value = 0;
                downloadUrl.value = '';
                mergedSize.value = '';
                filename.value = '';
                lastChunkTime.value = '';
                showStatus('已清空', 'info');
            };

            onUnmounted(() => {
                if (scanner && scanning.value) {
                    scanner.stop().catch(() => {});
                }
            });

            return {
                tab, scanning, statusMsg, statusType, manualText,
                chunks, totalChunks, downloadUrl, filename, mergedSize,
                lastChunkTime, receivedCount, missingCount, isComplete, missingChunks,
                switchTab, startScan, stopScan, addManual, merge, clearAll
            };
        }
    }).mount('#app');
    </script>
</body>
</html>
