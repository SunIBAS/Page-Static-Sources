<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>
        QR File Sender
    </title>


    <script src="./qrcodegen-v1.8.0-es5.js"></script>


    <style>


        body{

            font-family:Arial;

        }


        button{

            font-size:18px;

            margin:5px;

        }


        input{

            font-size:18px;

        }



        #qr{

            display:grid;

            padding:30px;

            background:white;

        }



        .cell{

            display:block;

        }


    </style>


</head>


<body>



<h2>
    电脑 → 手机二维码文件发送
</h2>



<input
        type="file"
        id="file"
>


<br><br>


<button onclick="start()">
    生成
</button>



<button onclick="next()">
    下一张
</button>



<button onclick="play()">
    ▶播放
</button>



<button onclick="pause()">
    ⏸暂停
</button>



<br><br>


<input
        id="jump"
        type="number"
        placeholder="输入编号"
/>


<button onclick="jumpTo()">
    跳转
</button>



<h3 id="info">
    等待文件
</h3>



<div id="qr"></div>





<script>



    const QRC =
        qrcodegen.QrCode;




    // 每个二维码的数据量
    // 可以自行调整
    const CHUNK_SIZE=700;




    // 自动播放速度
    // ms
    const PLAY_INTERVAL=1500;



    let chunks=[];


    let filename="";


    let current=0;


    let total=0;



    let timer=null;






    async function start()
    {

        pause();


        let file=
            document
                .getElementById("file")
                .files[0];



        if(!file)
        {
            alert("请选择文件");
            return;
        }



        filename=file.name;



        let buffer=
            await file.arrayBuffer();



        let bytes=
            new Uint8Array(buffer);



        chunks=[];



        for(
            let i=0;
            i<bytes.length;
            i+=CHUNK_SIZE
        )
        {

            let part=
                bytes.slice(
                    i,
                    i+CHUNK_SIZE
                );


            chunks.push(
                base64Encode(part)
            );

        }



        total=chunks.length;


        current=0;


        show();

    }





    function base64Encode(bytes)
    {

        let str="";


        for(
            let i=0;
            i<bytes.length;
            i++
        )
        {

            str+=
                String.fromCharCode(
                    bytes[i]
                );

        }


        return btoa(str);

    }






    function show()
    {

        if(chunks.length==0)
        {
            return;
        }



        /*

		格式：

		QRFILE|
		文件名|
		总数量|
		当前编号|
		数据

		*/


        let text=
            [
                "QRFILE",
                filename,
                total,
                current,
                chunks[current]

            ].join("|");





        let qr=
            QRC.encodeText(
                text,
                QRC.Ecc.LOW
            );



        draw(qr);




        document
            .getElementById("info")
            .innerHTML=
            `
    文件:
    ${filename}

    <br>

    当前:
    ${current+1}
    /
    ${total}

    <br>

    数据编号:
    ${current}

    <br>

    字符长度:
    ${text.length}

    `;



    }





    function next()
    {

        if(chunks.length==0)
        {
            return;
        }



        if(current < total-1)
        {

            current++;

            show();

        }
        else
        {

            pause();

            alert("已经是最后一张");

        }

    }





    function play()
    {

        if(timer)
        {
            return;
        }



        timer=
            setInterval(
                ()=>{
                    next();
                },
                PLAY_INTERVAL
            );

    }





    function pause()
    {

        if(timer)
        {

            clearInterval(timer);

            timer=null;

        }

    }






    function jumpTo()
    {

        if(chunks.length==0)
        {
            return;
        }



        let n=
            parseInt(
                document
                    .getElementById("jump")
                    .value
            );



        if(isNaN(n))
        {
            return;
        }



        /*
		   用户输入:
		   1 表示第一张

		   内部:
		   0开始
		*/


        n--;



        if(
            n>=0 &&
            n<total
        )
        {

            current=n;

            show();

        }


    }







    function draw(obj)
    {

        let div=
            document
                .getElementById("qr");



        div.innerHTML="";



        // 二维码模块大小
        let size=15;



        div.style=
            `
    grid-template-columns:
    repeat(${obj.size},${size}px)
    `;



        for(
            let y=0;
            y<obj.size;
            y++
        )
        {

            for(
                let x=0;
                x<obj.size;
                x++
            )
            {


                let e=
                    document
                        .createElement("i");



                e.className="cell";



                e.style.width=
                    size+"px";


                e.style.height=
                    size+"px";



                e.style.background=
                    obj.getModule(x,y)
                        ?
                        "#000"
                        :
                        "#fff";



                div.appendChild(e);


            }

        }

    }





</script>


</body>


</html>
